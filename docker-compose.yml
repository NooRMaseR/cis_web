services:
  db:
    image: postgres:18.3
    container_name: cis_postgres
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    networks:
      - cis_network

  redis:
    image: redis:8-alpine
    container_name: cis_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cis_network
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cis_backend
    restart: always
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - cis_network
    develop:
      watch:
        - action: sync
          path: ./bakcend
          target: /app
          ignore:
            - .venv/
            - pyproject.toml
            - uv.lock
        - action: rebuild
          path: "./backend/pyproject.toml"


volumes:
  postgres_data:

networks:
  cis_network:
    driver: bridge